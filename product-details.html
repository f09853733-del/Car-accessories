<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات محصول | AUTO LUXE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .details-page {
      min-height: 100vh;
      background: #111318;
      color: #fff;
      padding: 35px 6%;
    }

    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid #292d36;
    }

    .details-logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .details-logo span { color: #e63946; }

    .details-back {
      color: #fff;
      text-decoration: none;
      border: 1px solid #e63946;
      padding: 10px 20px;
      border-radius: 8px;
    }

    .details-card {
      max-width: 1050px;
      margin: 70px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
      align-items: center;
      background: #1b1f27;
      border: 1px solid #303540;
      border-radius: 20px;
      padding: 30px;
    }

    .details-image {
      background: #242934;
      border-radius: 15px;
      overflow: hidden;
      min-height: 350px;
    }

    .details-image img {
      width: 100%;
      height: 350px;
      object-fit: contain;
      display: block;
    }

    .details-info h1 {
      font-size: 30px;
      margin: 15px 0;
    }

    .details-category {
      color: #e63946;
    }

    .details-description {
      color: #aaa;
      line-height: 2.2;
      margin: 20px 0;
    }

    .details-rating {
      color: #ffc857;
      margin: 15px 0;
    }

    .details-price {
      font-size: 25px;
      font-weight: 900;
      margin: 25px 0;
    }

    .details-button {
      display: inline-block;
      background: #e63946;
      color: #fff;
      border: none;
      padding: 14px 30px;
      border-radius: 9px;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 750px) {
      .details-card {
        grid-template-columns: 1fr;
        margin: 35px auto;
        padding: 18px;
      }

      .details-info h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <main class="details-page">

    <header class="details-header">
      <div class="details-logo">AUTO <span>LUXE</span></div>
      <a href="products.html" class="details-back">بازگشت به محصولات</a>
    </header>

    <section class="details-card">
      <div class="details-image">
        <img src="images/sport-rim.jpg" alt="رینگ اسپرت خودرو">
      </div>

      <div class="details-info">
        <span class="details-category">لوازم جانبی خودرو</span>

        <h1>رینگ اسپرت خودرو</h1>

        <div class="details-rating">⭐ 4.9 از 5</div>

        <p class="details-description">
          رینگ اسپرت خودرو با طراحی مدرن و جذاب،
          کیفیت ساخت بالا و ظاهری لوکس برای خودروی شما.
          انتخابی مناسب برای افرادی که به زیبایی و کیفیت اهمیت می‌دهند.
        </p>

        <div class="details-price">۸,۵۰۰,۰۰۰ تومان</div>

        <button class="details-button" type="button">
          افزودن به سبد خرید
        </button>
      </div>
    </section>

  </main>
  <script src="product-details.js"></script>
</body>
</html>
