<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محصولات | AUTO LUXE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="products.css">
  <style>
    
  </style>
</head>

<body>
  <main class="products-page">

    <header class="products-header">
  <div class="products-logo">AUTO <span>LUXE</span></div>

  <div class="products-header-actions">
    <a class="back-home" href="index.html"
       data-fa="بازگشت به صفحه اصلی"
       data-en="Back to Home">بازگشت به صفحه اصلی</a>

    <button class="language-btn" id="languageToggle" type="button" onclick="toggleLanguage()">EN</button>
  </div>
</header>
   <section class="products-hero">
  <h1>فروشگاه <span>محصولات</span></h1>
  <p>تجهیزات و لوازم تخصصی خودرو را در AUTO LUXE پیدا کنید.</p>
</section>
    
  <section class="products-toolbar">

  <input
    type="text"
    class="products-search"
    id="productSearch"
    placeholder="جست‌وجوی محصولات..."
  >

  <div class="products-filters">
    <button class="products-filter active" data-category="all">همه محصولات</button>
    <button class="products-filter" data-category="لوازم جانبی">لوازم جانبی</button>
    <button class="products-filter" data-category="روغن و نگهداری">روغن و نگهداری</button>
    <button class="products-filter" data-category="تجهیزات الکترونیکی">تجهیزات الکترونیکی</button>
    <button class="products-filter" data-category="روشنایی خودرو">روشنایی خودرو</button>
    <button class="products-filter" data-category="قطعات یدکی">قطعات یدکی</button>
    <button class="products-filter" data-category="ایمنی خودرو">ایمنی خودرو</button>
  </div>

</section>

<section class="products-grid" id="productsGrid">
</section>

<div class="products-empty" id="productsEmpty">
  محصولی پیدا نشد.
</div>

<footer class="products-footer">
  © 2026 AUTO LUXE - تمامی حقوق محفوظ است.
</footer>

  </main>
  <script>
let currentLanguage = "fa";

function toggleLanguage() {
  currentLanguage = currentLanguage === "fa" ? "en" : "fa";

  document.documentElement.lang = currentLanguage;
  document.documentElement.dir = currentLanguage === "fa" ? "rtl" : "ltr";

  document.querySelectorAll("[data-fa][data-en]").forEach((element) => {
    element.textContent = element.getAttribute(
      currentLanguage === "fa" ? "data-fa" : "data-en"
    );
  });

  document.getElementById("languageToggle").textContent =
    currentLanguage === "fa" ? "EN" : "FA";
}
</script>
  <script src="products.js"></script>
</body>
</html>
